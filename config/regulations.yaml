  - id: ardfm53
    title: "Постановление Правления АРРФР от 03.04.2026 № 53 «Об утверждении Требований к обеспечению информационной безопасности банков…» (заменило пост. НБРК № 48 от 27.03.2018)"
    url: "https://adilet.zan.kz/rus/docs/V2600038336"
