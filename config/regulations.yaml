clauses:
  - id: nbrk231_cash_on_desk
    source: nbrk231
    point: "п. 20, ч. 2"
    quote: "На рабочем месте кассового работника находятся наличные деньги клиента. Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ, предназначенных для хранения наличных денег (металлический шкаф, сейф, тележка, ящики стола, тумба)."

  - id: nbrk231_leave_workplace
    source: nbrk231
    point: "п. 22"
    quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."

  - id: nbrk231_personal_items
    source: nbrk231
    point: "п. 12, ч. 1"
    quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла в порядке, установленном внутренними документами банка."

  - id: nbrk231_phone
    source: nbrk231
    point: "п. 12, ч. 2"
    quote: "Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи, не имеющих функции фото и видео фиксации."

  - id: nbrk231_access
    source: nbrk231
    point: "п. 75"
    quote: "Вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность наличных денег, а также лицам на основании распорядительного документа руководителя банка при сопровождении лиц, ответственных за сохранность наличных денег."

  - id: nbrk14_cash_room
    source: nbrk14
    point: "п. 8, ч. 1"
    quote: "Кассовый узел подлежит изолированию от других производственных, подсобных, подвальных и служебных помещений одним закрывающимся служебным входом."

  - id: nbrk231_recount
    source: nbrk231
    point: "п. 20, ч. 1; п. 31, пп. 4)"
    quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."

  - id: nbrk231_client_recount
    source: nbrk231
    point: "п. 35"
    quote: "Клиент пересчитывает полученные наличные деньги, не отходя от кассы, или в помещении для пересчета наличных денег клиентами в присутствии кассового работника или контролирующего работника."

  - id: nbrk231_collector_bag
    source: nbrk231
    point: "п. 24, пп. 3), 4)"
    quote: "Кассовый работник: … 3) проверяет целостность сумки; 4) проверяет правильность пломбирования сумки."

  # Auto-lock after 30 min of inactivity. NOT a duty to lock the PC when leaving - don't cite it
  # as such. Kept for reference only (not linked from taxonomy.yaml).
  - id: ardfm53_autolock
    source: ardfm53
    point: "п. 71, пп. 9)"
    quote: "при неактивности пользователя более 30 (тридцати) минут информационная система автоматически завершает сеанс работы пользователя либо блокирует рабочую станцию или ноутбук с возможностью разблокировки только при вводе аутентификационных данных пользователя."
